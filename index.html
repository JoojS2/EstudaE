<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f3ee" id="theme-color">
    <script>try { const t=localStorage.getItem("estudae:theme"); document.documentElement.dataset.theme = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; } catch (_) { document.documentElement.dataset.theme="light"; }</script>
    <title>Estudaê 10.0 — seu espaço de estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Layout principal: navegação lateral e conteúdo -->
    <div class="layout">
        <aside class="sidebar">
            <!-- Identidade visual da plataforma -->
            <div class="brand">
                <span class="brand-icon">✦</span>
                <span>estuda<span class="accent">ê</span><small>SEU ESPAÇO DE ESTUDOS</small></span>
            </div>
            <div class="side-label">MENU PRINCIPAL</div>
            <!-- Menu preenchido dinamicamente pelo script.js -->
            <nav id="nav"></nav>
            <div class="sidebar-bottom">
                <div class="mini-icon">✧</div>
                <b>Um passo por dia.</b>
                <p>Aprender fica mais leve quando você evolui no seu ritmo.</p>
            </div>
        </aside>

        <div class="content">
            <header class="topbar">
                <span class="breadcrumb">Estudaê <span>/</span> <strong id="current-page">Início</strong></span>
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo escuro" title="Alternar tema"><span class="theme-symbol" aria-hidden="true">☾</span><span class="theme-caption">Modo escuro</span></button>
                <div class="profile">
                    <span class="status-dot"></span>
                    Seu espaço de aprendizado
                    <span class="avatar">E</span>
                </div>
            </header>
            <!-- As telas são renderizadas neste elemento -->
            <main id="app"></main>
        </div>
    </div>

    <!-- Socket.IO: comunicação em tempo real com o servidor -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <!-- Edite SERVER_URL com o endereço real do seu serviço no Render. -->
    <script src="config.js"></script>
    <script>
      (function () {
        const button = document.getElementById("themeToggle");
        const meta = document.getElementById("theme-color");
        function update() {
          const dark = document.documentElement.dataset.theme === "dark";
          button.querySelector(".theme-symbol").textContent = dark ? "☀" : "☾";
          button.querySelector(".theme-caption").textContent = dark ? "Modo claro" : "Modo escuro";
          button.setAttribute("aria-label", dark ? "Ativar modo claro" : "Ativar modo escuro");
          button.setAttribute("aria-pressed", String(dark));
          meta.setAttribute("content", dark ? "#111b1c" : "#f1f3ee");
        }
        button.addEventListener("click", function () {
          const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem("estudae:theme", next); } catch (_) {}
          update();
        });
        update();
      })();
    </script>
    <!-- Funcionalidades de estudos e revisão -->
    <script src="script.js"></script>
    <!-- Funcionalidades das salas de quiz -->
    <script src="party.js"></script>
</body>
</html>
